<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospect — AgenticOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
    --bg:        #0D1421;
    --surface:   #131C2E;
    --surface2:  #1A2540;
    --border:    #1E2D45;
    --border2:   #263755;
    --gold:      #C8A96E;
    --gold-dim:  #8A6E42;
    --text:      #E8EAF0;
    --muted:     #7A8BAA;
    --green:     #4CAF8A;
    --amber:     #E8A838;
    --red:       #E05A6A;
    --blue:      #4A8FD4;
    --cyan:      #A8C4E8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
}

/* ── TOP BAR ── */
.topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
}
.back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    transition: color 0.15s;
    flex-shrink: 0;
}
.back-btn:hover { color: var(--gold); }
.sep { color: var(--border2); }
.firm-title {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.verdict-hero {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}
.verdict-letter {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
}
.verdict-letter.a { background: rgba(76,175,138,0.2); color: #4CAF8A; border: 1px solid rgba(76,175,138,0.4); }
.verdict-letter.b { background: rgba(200,169,110,0.2); color: #C8A96E; border: 1px solid rgba(200,169,110,0.4); }
.verdict-letter.c { background: rgba(120,120,140,0.15); color: #888; border: 1px solid rgba(120,120,140,0.3); }
.verdict-name { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; }
.status-pill {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-family: 'DM Mono', monospace;
    font-weight: 500; letter-spacing: 0.04em;
    text-transform: uppercase; border: 1px solid;
    flex-shrink: 0;
}
.status-pill.researched { color: var(--muted);  border-color: var(--border2);              background: rgba(122,139,170,0.08); }
.status-pill.pitched    { color: var(--amber);  border-color: rgba(232,168,56,0.3);        background: rgba(232,168,56,0.08); }
.status-pill.audited    { color: var(--green);  border-color: rgba(76,175,138,0.3);        background: rgba(76,175,138,0.08); }
.status-pill.client     { color: var(--gold);   border-color: rgba(200,169,110,0.3);       background: rgba(200,169,110,0.08); }

/* ── PAGE LAYOUT ── */
.page {
    max-width: 1160px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
    align-items: start;
}
@media (max-width: 780px) { .page { grid-template-columns: 1fr; } }

/* ── CARDS ── */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
}
.card:last-child { margin-bottom: 0; }
.card-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.card-label::after {
    content: '';
    flex: 1; height: 1px;
    background: var(--border);
}

/* ── LEFT COL ── */
.left-col { display: flex; flex-direction: column; }

/* Verdict card */
.verdict-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
}
.verdict-big {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
}
.verdict-letter-big {
    width: 54px; height: 54px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    flex-shrink: 0;
}
.verdict-letter-big.a { background: rgba(76,175,138,0.15); color: #4CAF8A; border: 1px solid rgba(76,175,138,0.35); }
.verdict-letter-big.b { background: rgba(200,169,110,0.15); color: #C8A96E; border: 1px solid rgba(200,169,110,0.35); }
.verdict-letter-big.c { background: rgba(120,120,140,0.12); color: #888;   border: 1px solid rgba(120,120,140,0.25); }
.verdict-meta { display: flex; flex-direction: column; gap: 2px; }
.verdict-label-big { font-size: 18px; font-weight: 700; }
.verdict-desc { font-size: 11px; color: var(--muted); }
.conf-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.conf-tile {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
}
.conf-label {
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 4px;
}
.conf-val {
    font-size: 20px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    color: var(--cyan);
    line-height: 1;
}
.conf-bar {
    height: 3px;
    background: var(--border2);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
}
.conf-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--cyan);
    transition: width 0.5s ease;
}

/* Financial value card */
.fv-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
}
.fv-amount {
    font-size: 26px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    color: var(--green);
    line-height: 1.1;
}
.fv-amount.unknown { color: var(--muted); font-size: 18px; font-style: italic; }
.fv-range {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
}
.fv-basis {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    line-height: 1.4;
}
.fv-conf-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}
.fv-conf-bar {
    flex: 1;
    height: 3px;
    background: var(--border2);
    border-radius: 2px;
    overflow: hidden;
}
.fv-conf-fill { height: 100%; border-radius: 2px; background: var(--green); }
.fv-conf-label { font-size: 9px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; }

/* Firm details */
.detail-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
}
.detail-row:last-child { border-bottom: none; padding-bottom: 0; }
.detail-row:first-child { padding-top: 0; }
.detail-key {
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
}
.detail-val { font-size: 13px; color: var(--text); line-height: 1.4; }
.detail-val a { color: var(--gold); text-decoration: none; }
.detail-val a:hover { text-decoration: underline; }

/* Actions */
.act-btn {
    width: 100%; padding: 10px 16px;
    border-radius: 7px; border: 1px solid;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    display: flex; align-items: center;
    justify-content: center; gap: 8px;
    transition: all 0.15s;
    text-decoration: none;
    margin-bottom: 8px;
}
.act-btn:last-child { margin-bottom: 0; }
.act-btn.gold {
    background: rgba(200,169,110,0.12);
    border-color: rgba(200,169,110,0.35);
    color: var(--gold);
}
.act-btn.gold:hover { background: rgba(200,169,110,0.22); }
.act-btn.blue {
    background: rgba(74,143,212,0.08);
    border-color: rgba(74,143,212,0.3);
    color: var(--blue);
}
.act-btn.blue:hover { background: rgba(74,143,212,0.16); }
.act-btn.ghost {
    background: transparent;
    border-color: var(--border2);
    color: var(--muted);
}
.act-btn.ghost:hover { color: var(--text); border-color: var(--border2); }

/* ── RIGHT COL ── */
.right-col { display: flex; flex-direction: column; }

/* Score bars */
.score-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
}
.score-row:last-child { border-bottom: none; }
.score-key {
    font-size: 10px; font-family: 'DM Mono', monospace;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em;
    width: 110px; flex-shrink: 0;
}
.score-bar {
    flex: 1; height: 5px;
    background: var(--border2);
    border-radius: 3px; overflow: hidden;
}
.score-bar-fill {
    height: 100%; border-radius: 3px;
    background: var(--gold);
    transition: width 0.5s ease;
}
.score-bar-fill.total { background: var(--green); }
.score-num {
    font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--text);
    min-width: 36px; text-align: right;
}
.total-score-row .score-key { color: var(--text); font-weight: 500; }
.total-score-row .score-num { color: var(--green); font-weight: 700; font-size: 13px; }

/* Primary thesis */
.thesis-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    font-style: italic;
    border-left: 3px solid var(--gold-dim);
    padding-left: 14px;
}

/* Pain signals */
.signal-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}
.signal-item:last-child { border-bottom: none; padding-bottom: 0; }
.signal-item:first-child { padding-top: 0; }
.signal-top {
    display: flex; align-items: flex-start;
    gap: 8px; margin-bottom: 5px;
}
.strength-badge {
    font-size: 8px; font-family: 'DM Mono', monospace;
    font-weight: 700; padding: 2px 6px; border-radius: 3px;
    letter-spacing: 0.07em; white-space: nowrap;
    flex-shrink: 0; margin-top: 1px;
}
.strength-badge.OBSERVED    { background: rgba(76,175,138,0.15); color:#4CAF8A; border:1px solid rgba(76,175,138,0.3); }
.strength-badge.INDICATED   { background: rgba(232,168,56,0.12); color:#E8A838; border:1px solid rgba(232,168,56,0.3); }
.strength-badge.HYPOTHESISED{ background: rgba(120,120,140,0.1); color:#888;    border:1px solid rgba(120,120,140,0.2); }
.signal-desc { font-size: 13px; color: var(--text); line-height: 1.4; }
.signal-evidence {
    font-size: 11px; color: var(--muted);
    font-style: italic; line-height: 1.4;
    padding: 5px 8px;
    background: rgba(255,255,255,0.02);
    border-radius: 4px;
    border-left: 2px solid var(--border2);
    margin-top: 2px;
}

/* Outreach intel */
.oi-section { margin-bottom: 14px; }
.oi-section:last-child { margin-bottom: 0; }
.oi-label {
    font-size: 9px; font-family: 'DM Mono', monospace;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 5px;
}
.oi-text {
    font-size: 13px; color: var(--text); line-height: 1.5;
}
.oi-angle {
    background: rgba(200,169,110,0.07);
    border: 1px solid rgba(200,169,110,0.2);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--gold);
    line-height: 1.5;
}
.objection-chip {
    display: inline-block;
    background: rgba(224,90,106,0.08);
    border: 1px solid rgba(224,90,106,0.2);
    color: var(--red);
    border-radius: 4px;
    padding: 3px 9px;
    font-size: 11px;
    margin: 3px 3px 0 0;
}

/* Audit history */
.history-row {
    display: flex; align-items: flex-start;
    gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
}
.history-row:last-child { border-bottom: none; }
.history-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold-dim); margin-top: 5px; flex-shrink: 0;
}
.history-dot.complete { background: var(--green); }
.history-info { flex: 1; }
.history-title { font-size: 13px; font-weight: 500; }
.history-meta { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
.report-link {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px;
    background: rgba(76,175,138,0.1);
    border: 1px solid rgba(76,175,138,0.3);
    border-radius: 6px;
    color: var(--green); font-size: 12px; font-weight: 500;
    text-decoration: none; transition: background 0.15s; white-space: nowrap;
}
.report-link:hover { background: rgba(76,175,138,0.2); }

/* Misc */
.empty-msg {
    font-size: 12px; color: var(--muted);
    text-align: center; padding: 24px 0;
    font-style: italic;
}
.loading-msg {
    font-size: 12px; color: var(--muted);
    font-family: 'DM Mono', monospace;
    padding: 60px 0; text-align: center;
    grid-column: 1 / -1;
    letter-spacing: 0.05em;
}
</style>
</head>
<body>

<div class="topbar">
    <a href="/" class="back-btn">← AgenticOS</a>
    <span class="sep">/</span>
    <div class="firm-title" id="firmTitle">Loading…</div>
    <div class="verdict-hero" id="verdictHero" style="display:none">
        <div class="verdict-letter" id="topVerdictLetter"></div>
        <span class="verdict-name" id="topVerdictName"></span>
    </div>
    <span class="status-pill" id="statusPill" style="display:none"></span>
</div>

<div class="page" id="pageContent">
    <div class="loading-msg">Loading prospect intelligence…</div>
</div>

<script>
function esc(s) {
    if (!s && s !== 0) return '';
    return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtGbp(n) {
    if (typeof n !== 'number') return '—';
    return '£' + Math.round(n).toLocaleString('en-GB');
}
function fmtDate(iso) {
    if (!iso) return '—';
    try {
        return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    } catch { return iso; }
}
function statusClass(s) {
    return ['researched','pitched','audited','client'].includes(s) ? s : 'researched';
}
function statusLabel(s) {
    return { researched:'Researched', pitched:'Pitched', audited:'Audited', client:'Client' }[s] || s;
}
const VERDICT_LABEL = { A:'Hunt', B:'Watch', C:'Pass' };
const VERDICT_DESC  = { A:'Strong signal — move now', B:'Potential — needs more info', C:'Not worth pursuing now' };

// ── Build left column ──────────────────────────────────────────────────────
function buildLeft(p) {
    const status   = p.status  || 'researched';
    const verdict  = p.verdict || 'B';
    const vLabel   = VERDICT_LABEL[verdict] || verdict;
    const vDesc    = VERDICT_DESC[verdict]  || '';
    const vCls     = verdict.toLowerCase();
    const conf     = p.confidence          || 0;
    const evConf   = p.evidence_confidence || 0;

    // Financial value
    const fv = p.financial_value || {};
    const fvKnown = fv.status === 'known' && fv.amount_gbp;
    const fvHtml = fvKnown ? `
        <div class="fv-amount">${fmtGbp(fv.amount_gbp)}<span style="font-size:13px;font-weight:400;color:var(--muted)">/yr</span></div>
        ${fv.range_low && fv.range_high ? `<div class="fv-range">${fmtGbp(fv.range_low)} – ${fmtGbp(fv.range_high)}</div>` : ''}
        ${fv.basis ? `<div class="fv-basis">${esc(fv.basis)}</div>` : ''}
        ${fv.confidence ? `<div class="fv-conf-row">
            <div class="fv-conf-bar"><div class="fv-conf-fill" style="width:${fv.confidence}%"></div></div>
            <span class="fv-conf-label">${fv.confidence}% confidence</span>
        </div>` : ''}
    ` : `<div class="fv-amount unknown">UNKNOWN</div>
        <div class="fv-basis" style="border:none;padding:0;margin-top:4px">${esc(fv.basis || 'Insufficient size signals in public data')}</div>`;

    // Firm detail rows
    const details = [
        p.website      ? { k:'Website',  v:`<a href="${esc(p.website.startsWith('http') ? p.website : 'https://'+p.website)}" target="_blank">${esc(p.website)} ↗</a>` } : null,
        p.contact_name ? { k:'Contact',  v: esc(p.contact_name) } : null,
        p.email        ? { k:'Email',    v:`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` } : null,
        p.linkedin_url ? { k:'LinkedIn', v:`<a href="${esc(p.linkedin_url)}" target="_blank">View ↗</a>` } : null,
        p.industry     ? { k:'Industry', v: esc(p.industry) } : null,
        p.niche        ? { k:'Niche',    v: esc(p.niche) }    : null,
        p.employee_count ? { k:'Size',   v: esc(p.employee_count) } : null,
        (p.software_stack && p.software_stack !== 'unknown') ? { k:'Stack', v: esc(p.software_stack) } : null,
        p.researched_at ? { k:'Researched', v: fmtDate(p.researched_at) } : null,
    ].filter(Boolean);

    const detailsHtml = details.map(d => `
        <div class="detail-row">
            <span class="detail-key">${esc(d.k)}</span>
            <span class="detail-val">${d.v}</span>
        </div>`).join('');

    // Actions
    let actionsHtml = '';
    if (status === 'researched') {
        actionsHtml += `<button class="act-btn blue" onclick="doPitch()">✉ Draft Pitch Email</button>`;
    }
    actionsHtml += `<button class="act-btn gold" onclick="doAudit()">⟐ Start Live Audit</button>`;
    actionsHtml += `<button class="act-btn ghost" onclick="doReResearch()">↺ Re-Research</button>`;

    return `
    <div class="left-col">

        <!-- Verdict -->
        <div class="verdict-card">
            <div class="card-label">Intelligence Verdict</div>
            <div class="verdict-big">
                <div class="verdict-letter-big ${vCls}">${esc(verdict)}</div>
                <div class="verdict-meta">
                    <div class="verdict-label-big" style="color:${verdict==='A'?'var(--green)':verdict==='B'?'var(--gold)':'var(--muted)'}">${esc(vLabel)}</div>
                    <div class="verdict-desc" style="font-size:11px;color:var(--muted)">${esc(vDesc)}</div>
                </div>
            </div>
            <div class="conf-grid">
                <div class="conf-tile">
                    <div class="conf-label">Verdict Conf.</div>
                    <div class="conf-val" style="color:var(--cyan)">${conf}%</div>
                    <div class="conf-bar"><div class="conf-bar-fill" style="width:${conf}%"></div></div>
                </div>
                <div class="conf-tile">
                    <div class="conf-label">Evidence Qual.</div>
                    <div class="conf-val" style="color:var(--blue)">${evConf}%</div>
                    <div class="conf-bar"><div class="conf-bar-fill" style="width:${evConf}%;background:var(--blue)"></div></div>
                </div>
            </div>
        </div>

        <!-- Financial Value -->
        <div class="fv-card">
            <div class="card-label">Est. Annual Value</div>
            ${fvHtml}
        </div>

        <!-- Firm Details -->
        <div class="card">
            <div class="card-label">Firm Details</div>
            ${detailsHtml || '<div class="empty-msg">No details recorded.</div>'}
        </div>

        <!-- Actions -->
        <div class="card">
            <div class="card-label">Actions</div>
            ${actionsHtml}
        </div>

    </div>`;
}

// ── Build right column ─────────────────────────────────────────────────────
function buildRight(p, auditSessions) {
    const painScore    = p.pain_score         || 0;
    const valueScore   = p.value_score        || 0;
    const urgencyScore = p.urgency_score      || 0;
    const repeatScore  = p.repeatability_score|| 0;
    const totalScore   = p.total_score        || (painScore + valueScore + urgencyScore + repeatScore);

    function scoreBar(val, max, cls='') {
        const pct = max > 0 ? Math.min(100, (val/max)*100) : 0;
        return `<div class="score-bar"><div class="score-bar-fill ${cls}" style="width:${pct}%"></div></div>`;
    }

    const scoresHtml = `
    <div class="card">
        <div class="card-label">Commercial Score</div>
        <div class="score-row">
            <span class="score-key">Pain</span>
            ${scoreBar(painScore, 5)}
            <span class="score-num">${painScore}/5</span>
        </div>
        <div class="score-row">
            <span class="score-key">Financial Value</span>
            ${scoreBar(valueScore, 5)}
            <span class="score-num">${valueScore}/5</span>
        </div>
        <div class="score-row">
            <span class="score-key">Urgency</span>
            ${scoreBar(urgencyScore, 5)}
            <span class="score-num">${urgencyScore}/5</span>
        </div>
        <div class="score-row">
            <span class="score-key">Repeatability</span>
            ${scoreBar(repeatScore, 5)}
            <span class="score-num">${repeatScore}/5</span>
        </div>
        <div class="score-row total-score-row" style="margin-top:4px;padding-top:11px;border-top:1px solid var(--border);border-bottom:none">
            <span class="score-key">Total</span>
            ${scoreBar(totalScore, 20, 'total')}
            <span class="score-num">${totalScore}/20</span>
        </div>
    </div>`;

    // Primary thesis
    const thesisHtml = p.primary_thesis ? `
    <div class="card">
        <div class="card-label">Commercial Thesis</div>
        <p class="thesis-text">${esc(p.primary_thesis)}</p>
    </div>` : '';

    // Pain signals
    const signals = Array.isArray(p.pain_signals) ? p.pain_signals : [];
    const signalsHtml = `
    <div class="card">
        <div class="card-label">Pain Signals (${signals.length})</div>
        ${signals.length ? signals.map(s => `
            <div class="signal-item">
                <div class="signal-top">
                    <span class="strength-badge ${esc(s.strength)}">${esc(s.strength)}</span>
                    <span class="signal-desc">${esc(s.description)}</span>
                </div>
                ${s.evidence && s.evidence !== s.description ? `<div class="signal-evidence">${esc(s.evidence.slice(0, 200))}${s.evidence.length > 200 ? '…' : ''}</div>` : ''}
            </div>`).join('')
        : '<div class="empty-msg">No structured signals recorded yet.</div>'}
    </div>`;

    // Outreach intel
    const oi = p.outreach_intel || {};
    const hasOi = oi.why_now || oi.outreach_angle || (oi.objections && oi.objections.length);
    const oiHtml = hasOi ? `
    <div class="card">
        <div class="card-label">Outreach Intelligence</div>
        ${oi.why_now ? `
        <div class="oi-section">
            <div class="oi-label">Why Now</div>
            <div class="oi-text">${esc(oi.why_now)}</div>
        </div>` : ''}
        ${oi.outreach_angle ? `
        <div class="oi-section">
            <div class="oi-label">Opening Angle</div>
            <div class="oi-angle">${esc(oi.outreach_angle)}</div>
        </div>` : ''}
        ${oi.objections && oi.objections.length ? `
        <div class="oi-section">
            <div class="oi-label">Likely Objections</div>
            <div>${oi.objections.map(o => `<span class="objection-chip">${esc(o)}</span>`).join('')}</div>
        </div>` : ''}
    </div>` : '';

    // Outreach drafts
    const draftsHtml = (p.outreach_email || p.outreach_dm) ? `
    <div class="card">
        <div class="card-label">Outreach Drafts</div>
        ${p.outreach_email ? `
        <div class="oi-section">
            <div class="oi-label">Email Draft</div>
            <pre style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.6">${esc(p.outreach_email)}</pre>
        </div>` : ''}
        ${p.outreach_dm ? `
        <div class="oi-section">
            <div class="oi-label">DM Draft</div>
            <pre style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.6">${esc(p.outreach_dm)}</pre>
        </div>` : ''}
    </div>` : '';

    // Intelligence gaps (unknowns + contradictions)
    const unknowns = Array.isArray(p.unknowns) ? p.unknowns : [];
    const contras  = Array.isArray(p.contradictions) ? p.contradictions : [];
    const gapsHtml = (unknowns.length || contras.length) ? `
    <div class="card">
        <div class="card-label">Intelligence Gaps</div>
        ${unknowns.length ? `
        <div class="oi-section">
            <div class="oi-label" style="color:var(--muted)">Unknown</div>
            ${unknowns.map(u => `<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:4px">
                <span style="color:var(--muted);font-size:11px;margin-top:2px">?</span>
                <span style="font-size:12px;color:var(--muted)">${esc(u)}</span>
            </div>`).join('')}
        </div>` : ''}
        ${contras.length ? `
        <div class="oi-section">
            <div class="oi-label" style="color:var(--amber)">Contradictory signals</div>
            ${contras.map(c => `<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:4px">
                <span style="color:var(--amber);font-size:11px;margin-top:2px">⚠</span>
                <span style="font-size:12px;color:var(--text)">${esc(c)}</span>
            </div>`).join('')}
        </div>` : ''}
    </div>` : '';

    // Audit history
    const histHtml = auditSessions.length ? `
    <div class="card">
        <div class="card-label">Audit History</div>
        ${auditSessions.sort((a,b) => b.started_at > a.started_at ? 1:-1).map(s => {
            const done = s.status !== 'in_progress';
            return `<div class="history-row">
                <div class="history-dot ${done?'complete':''}"></div>
                <div class="history-info">
                    <div class="history-title">${done?'Audit Completed':'Audit In Progress'}</div>
                    <div class="history-meta">${fmtDate(s.started_at)} · ${s.auditor||'Kane'} · ${(s.processes||[]).length||0} processes</div>
                </div>
                ${(s.report_path||s.status==='report_generated'||s.status==='complete') ? `<a class="report-link" href="/api/audit/report/${esc(s.id)}" target="_blank">📄 Report</a>` : ''}
            </div>`;
        }).join('')}
    </div>` : '';

    return `
    <div class="right-col">
        ${scoresHtml}
        ${thesisHtml}
        ${signalsHtml}
        ${oiHtml}
        ${gapsHtml}
        ${draftsHtml}
        ${histHtml}
    </div>`;
}

// ── Audit sessions ─────────────────────────────────────────────────────────
async function fetchAuditSessions(prospectId, firmName) {
    try {
        const res = await fetch('/api/audit/sessions');
        if (!res.ok) return [];
        const data = await res.json();
        return (data.sessions || data || []).filter(s =>
            (prospectId && s.prospect_id === prospectId) ||
            (firmName && s.firm_name && s.firm_name.toLowerCase() === firmName.toLowerCase())
        );
    } catch { return []; }
}

// ── Actions ───────────────────────────────────────────────────────────────
let _prospect = null;
function doPitch() {
    if (!_prospect) return;
    window.location.href = `/?pitchProspect=${encodeURIComponent(_prospect.id)}`;
}
function doAudit() {
    if (!_prospect) return;
    window.open(`/audit?firm=${encodeURIComponent(_prospect.firm_name)}&prospect_id=${encodeURIComponent(_prospect.id)}`, '_blank');
}
function doReResearch() {
    if (!_prospect) return;
    const msg = `research prospect "${_prospect.firm_name}" website="${_prospect.website||''}"`;
    window.location.href = `/?chat=${encodeURIComponent(msg)}`;
}

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
    const pathParts  = window.location.pathname.split('/').filter(Boolean);
    const prospectId = pathParts[pathParts.length - 1] || new URLSearchParams(location.search).get('id');
    if (!prospectId) {
        document.getElementById('pageContent').innerHTML = '<div class="loading-msg">No prospect ID.</div>';
        return;
    }
    try {
        const res = await fetch(`/api/prospects/${encodeURIComponent(prospectId)}`);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        const p = data.prospect || data;
        _prospect = p;

        // Top bar
        document.getElementById('firmTitle').textContent = p.firm_name || prospectId;
        document.title = `${p.firm_name} — AgenticOS`;
        const verdict = p.verdict || 'B';
        const vl = document.getElementById('topVerdictLetter');
        vl.textContent  = verdict;
        vl.className    = `verdict-letter ${verdict.toLowerCase()}`;
        document.getElementById('topVerdictName').textContent = VERDICT_LABEL[verdict] || verdict;
        document.getElementById('verdictHero').style.display = 'flex';
        const pill = document.getElementById('statusPill');
        pill.textContent = statusLabel(p.status || 'researched');
        pill.className   = `status-pill ${statusClass(p.status || 'researched')}`;
        pill.style.display = '';

        const auditSessions = await fetchAuditSessions(prospectId, p.firm_name);
        document.getElementById('pageContent').innerHTML =
            buildLeft(p) + buildRight(p, auditSessions);

    } catch(e) {
        document.getElementById('pageContent').innerHTML =
            '<div class="loading-msg" style="color:var(--red)">Failed to load prospect.</div>';
    }
}
init();
</script>
</body>
</html>
